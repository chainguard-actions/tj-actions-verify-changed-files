name: Test changed files detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git and commit any pending changes to start clean
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git diff --cached --quiet || git commit -m "chore: commit test fixtures for clean state"

      - name: Create an uncommitted file change
        run: |
          echo "test modification" >> README.md

      - id: action
        uses: .

      - name: Assert files_changed is true
        env:
          FILES_CHANGED: ${{ steps.action.outputs.files_changed }}
          CHANGED_FILES: ${{ steps.action.outputs.changed_files }}
        run: |
          echo "files_changed: $FILES_CHANGED"
          echo "changed_files: $CHANGED_FILES"
          if [ "$FILES_CHANGED" != "true" ]; then
            echo "FAIL: expected files_changed=true but got '$FILES_CHANGED'"
            exit 1
          fi
          if [ -z "$CHANGED_FILES" ]; then
            echo "FAIL: expected changed_files to be non-empty"
            exit 1
          fi
          echo "PASS: changed files detected: $CHANGED_FILES"
