name: Test no changes detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/clean-repo"
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create a clean git repo in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clean-repo"
          cd "$GITHUB_WORKSPACE/clean-repo"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "initial content" > initial.txt
          git add .
          git commit -m "Initial commit"

      - id: action
        uses: .
        with:
          path: clean-repo

      - name: Assert files_changed is false
        env:
          FILES_CHANGED: ${{ steps.action.outputs.files_changed }}
          CHANGED_FILES: ${{ steps.action.outputs.changed_files }}
        run: |
          echo "files_changed: $FILES_CHANGED"
          echo "changed_files: $CHANGED_FILES"
          if [ "$FILES_CHANGED" != "false" ]; then
            echo "FAIL: expected files_changed=false but got '$FILES_CHANGED'"
            exit 1
          fi
          if [ -n "$CHANGED_FILES" ]; then
            echo "FAIL: expected changed_files to be empty but got '$CHANGED_FILES'"
            exit 1
          fi
          echo "PASS"
