name: Test fail-if-changed causes failure when files changed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/test-repo"
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create a git repo in a subdirectory with an uncommitted change
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-repo"
          cd "$GITHUB_WORKSPACE/test-repo"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "initial content" > initial.txt
          git add .
          git commit -m "Initial commit"
          # Create an uncommitted change
          echo "test-change-$(date +%s)" > test-modified-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: test-repo
          fail-if-changed: "true"
          fail-message: "Test files have changed unexpectedly."

      - name: Assert action failed because files changed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILES_CHANGED: ${{ steps.action.outputs.files_changed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "files_changed: $FILES_CHANGED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (fail-if-changed=true with changes present) but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when files changed with fail-if-changed=true"
