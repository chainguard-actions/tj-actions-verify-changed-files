name: Test with uncommitted changes detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/test-repo"
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create a git repo in a subdirectory with an uncommitted change
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-repo"
          cd "$GITHUB_WORKSPACE/test-repo"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "initial content" > initial.txt
          git add .
          git commit -m "Initial commit"
          # Now create an uncommitted change
          echo "test-change-$(date +%s)" > test-modified-file.txt

      - id: action
        uses: .
        with:
          path: test-repo

      - name: Assert files_changed is true and changed_files is populated
        env:
          FILES_CHANGED: ${{ steps.action.outputs.files_changed }}
          CHANGED_FILES: ${{ steps.action.outputs.changed_files }}
        run: |
          echo "files_changed: $FILES_CHANGED"
          echo "changed_files: $CHANGED_FILES"
          if [ "$FILES_CHANGED" != "true" ]; then
            echo "FAIL: expected files_changed=true but got '$FILES_CHANGED'"
            exit 1
          fi
          if [ -z "$CHANGED_FILES" ]; then
            echo "FAIL: expected changed_files to be non-empty"
            exit 1
          fi
          echo "PASS: files_changed=true and changed_files='$CHANGED_FILES'"
