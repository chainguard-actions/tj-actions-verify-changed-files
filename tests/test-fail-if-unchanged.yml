name: Test fail-if-unchanged
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git and commit any pending changes to ensure clean state
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git diff --cached --quiet || git commit -m "chore: commit test fixtures for clean state"

      - name: Verify workspace is clean
        run: |
          git status
          git diff --stat

      - id: action
        uses: .
        continue-on-error: true
        with:
          fail-if-unchanged: "true"
          fail-message: "No files have changed."

      - name: Assert action failed because no files changed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILES_CHANGED: ${{ steps.action.outputs.files_changed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "files_changed: $FILES_CHANGED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (fail-if-unchanged=true and no files changed) but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no files changed with fail-if-unchanged=true"
