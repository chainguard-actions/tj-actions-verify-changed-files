name: Test untracked new file detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create a new untracked file
        run: |
          echo "new untracked content" > new-untracked-file.txt

      - id: action
        uses: .
        # new-untracked-file.txt is untracked — expect files_changed=true

      - name: Assert untracked file is detected as changed
        env:
          FILES_CHANGED: ${{ steps.action.outputs.files_changed }}
          CHANGED_FILES: ${{ steps.action.outputs.changed_files }}
        run: |
          echo "files_changed: $FILES_CHANGED"
          echo "changed_files: $CHANGED_FILES"
          if [ "$FILES_CHANGED" != "true" ]; then
            echo "FAIL: expected files_changed=true for untracked file but got '$FILES_CHANGED'"
            exit 1
          fi
          if [ -z "$CHANGED_FILES" ]; then
            echo "FAIL: expected changed_files to be non-empty"
            exit 1
          fi
          echo "PASS: untracked file correctly detected as changed"
